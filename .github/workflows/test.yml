name: Tests

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

# A second push to a PR makes the in-flight run redundant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (${{ matrix.leg }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # pytest-homeassistant-custom-component pins one exact Home Assistant
          # version per release, so the dependency group is how the HA version
          # under test is chosen. See the comments in pyproject.toml.
          - leg: latest
            group: dev
          # The hacs.json floor. A failure here means the integration cannot
          # actually run on the oldest version HACS offers it to, which is
          # either a bug to fix or a floor to raise -- not a test to weaken.
          - leg: min-ha
            group: min-ha
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install
        run: uv sync --no-default-groups --group ${{ matrix.group }}

      # tests/js/ (plain node --test, no npm/package.json anywhere in this
      # repo) is the ONLY coverage for the designer panel's keyboard-
      # containment fix -- runs nowhere else. Once per matrix run (not
      # HA-version-dependent) is enough, same rationale as "Upload
      # coverage" below only running on one leg.
      - name: Run JS tests
        if: matrix.leg == 'latest'
        run: scripts/test-js

      - name: Run tests
        run: >
          uv run --no-default-groups --group ${{ matrix.group }}
          pytest tests/ --cov-report=xml

      - name: Upload coverage
        if: matrix.leg == 'latest'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install
        run: uv sync --group dev

      - name: Check
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .
