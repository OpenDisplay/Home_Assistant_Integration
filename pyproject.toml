[project]
name = "opendisplay-homeassistant"
version = "0.0.0"
description = "OpenDisplay Home Assistant custom integration"
# Home Assistant's own floor.
requires-python = ">=3.14.2"

# Mirrors custom_components/opendisplay/manifest.json "requirements". Everything
# else the integration imports (aiohttp, voluptuous, PIL) is supplied by Home
# Assistant itself, which the test dependency groups pin transitively.
dependencies = [
    "py-opendisplay[silabs-ota]==8.3.1",
    "odl-renderer==0.5.14",
]

[dependency-groups]
# One group per CI matrix leg. pytest-homeassistant is published from Home
# Assistant core with one release per HA release, and its version *is* the HA
# version: it pins homeassistant (and pytest, syrupy, freezegun, ...) exactly,
# so never re-pin those here. Picking the pytest-homeassistant version is
# picking the HA version being tested against.
#
#   dev     latest HA
#   min-ha  the hacs.json floor (2026.11.0 is the first pytest-homeassistant)
#
# The `bluetooth` extra pins the Home Assistant *component* requirements of the
# bluetooth stack (habluetooth, serialx, aiousbwatcher, ...). HA installs those
# at runtime from each component's own manifest.json, so they are invisible to
# uv, but the tests set up the real bluetooth component. If a future HA bump
# adds another such import, `scripts/ha-component-reqs` prints the full
# component requirement set to compare against.
#
#   dbus-fast  mock_bluetooth_adapters forces the *Linux* adapter path even on
#              macOS, so BlueZDBusObjects is constructed for real; without it
#              bluetooth setup dies on `NoneType is not callable`. The extra
#              only pulls it in on Linux, so macOS runs need it listed here.
#              Unpinned: uv.lock pins it.
dev = [
    "pytest-homeassistant[bluetooth]==2026.11.2",
    # Not a pytest-homeassistant dependency (PHCC used to pull it in).
    "pytest-cov==7.1.0",
    "ruff==0.15.17",
    "mypy==1.18.2",
    "dbus-fast",
]
min-ha = [
    "pytest-homeassistant[bluetooth]==2026.11.0",
    # Not a pytest-homeassistant dependency (PHCC used to pull it in).
    "pytest-cov==7.1.0",
    "ruff==0.15.17",
    "mypy==1.18.2",
    "dbus-fast",
]

[tool.uv]
package = false
# The two legs pin conflicting homeassistant versions; declaring them as
# mutually exclusive lets `uv lock` resolve both into a single uv.lock.
conflicts = [[{ group = "dev" }, { group = "min-ha" }]]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
norecursedirs = [".git", ".venv", "config"]
addopts = "-p no:respx --cov=custom_components.opendisplay --cov-report=term-missing"

[tool.coverage.run]
source = ["custom_components/opendisplay"]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.ruff]
target-version = "py314"
exclude = [".venv", "config", "scripts"]

[tool.ruff.lint]
# A subset of Home Assistant core's ruleset -- the rules that matter for an
# integration without turning this into a lint-cleanup project.
select = [
    "ASYNC", # flake8-async
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "D",     # pydocstyle
    "E",     # pycodestyle errors
    "F",     # pyflakes
    "FLY",   # flynt
    "G",     # flake8-logging-format
    "I",     # isort
    "ISC",   # flake8-implicit-str-concat
    "LOG",   # flake8-logging
    "PGH",   # pygrep-hooks
    "PIE",   # flake8-pie
    "PT",    # flake8-pytest-style
    "RET",   # flake8-return
    "RSE",   # flake8-raise
    "RUF",   # ruff-specific
    "SIM",   # flake8-simplify
    "SLOT",  # flake8-slots
    "T20",   # flake8-print
    "TID",   # tidy imports
    "TRY",   # tryceratops
    "UP",    # pyupgrade
    "W",     # pycodestyle warnings
]
ignore = [
    "D202",   # No blank lines allowed after function docstring
    "D203",   # 1 blank line required before class docstring
    "D213",   # Multi-line docstring summary should start at the second line
    "D406",   # Section name should end with a newline
    "D407",   # Section name underlining
    "E501",   # line too long -- ruff format owns line length
    "TRY003", # Avoid specifying long messages outside the exception class
    "TRY300", # Consider moving this statement to an `else` block
    "TRY400", # Use `logging.exception` instead of `logging.error`
]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components", "tests"]
combine-as-imports = true
split-on-trailing-comma = false

[tool.ruff.lint.per-file-ignores]
# Vendored verbatim from Home Assistant core's test helpers.
"tests/bluetooth.py" = ["D"]

[tool.ruff.lint.mccabe]
max-complexity = 25
