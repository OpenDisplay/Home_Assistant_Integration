activate_buzzer:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: opendisplay
    instance:
      required: false
      default: 0
      selector:
        number:
          min: 0
          max: 3
          mode: box
    frequency_hz:
      required: false
      default: 1000
      selector:
        number:
          min: 0
          max: 12000
          mode: box
          unit_of_measurement: Hz
    duration_ms:
      required: false
      default: 100
      selector:
        number:
          min: 5
          max: 1275
          mode: box
          unit_of_measurement: ms
    repeats:
      required: false
      default: 1
      selector:
        number:
          min: 1
          max: 255
          mode: box

drawcustom:
  name: Draw Custom Image
  description: Draws a custom image on one or more OpenDisplay devices
  target:
  fields:
    payload:
      name: Payload
      description: Drawing elements array (see drawcustom documentation)
      required: true
      example: >
        [{"type": "text", "value": "Hello!", "x": 0, "y": 0, "size": 40}]
      selector:
        object:
    background:
      name: Background color
      description: Background color
      required: true
      default: "white"
      example: white
      selector:
        select:
          options:
            - "white"
            - "black"
            - "accent"
            - "red"
            - "yellow"
    rotate:
      name: Rotation
      description: Rotation in degrees (0, 90, 180, 270)
      required: true
      default: 0
      selector:
        number:
          min: 0
          max: 270
          step: 90
    dither:
      name: Dither mode
      description: Dithering algorithm
      required: true
      default: "ordered"
      selector:
        select:
          translation_key: dither_mode
          options:
            - "none"
            - "burkes"
            - "ordered"
            - "floyd_steinberg"
            - "atkinson"
            - "stucki"
            - "sierra"
            - "sierra_lite"
            - "jarvis_judice_ninke"
    refresh_type:
      name: Refresh type
      description: E-paper refresh mode
      required: true
      default: "full"
      selector:
        select:
          translation_key: refresh_mode
          options:
            - "full"
            - "fast"
    tone_compression:
      name: Tone compression
      description: Tone compression strength (0–100%). Omit to use automatic tone mapping.
      required: false
      selector:
        number:
          min: 0
          max: 100
          step: 1
          mode: slider
          unit_of_measurement: "%"
    dry-run:
      name: Dry run
      description: Generate image without sending to device
      required: true
      default: false
      selector:
        boolean:
