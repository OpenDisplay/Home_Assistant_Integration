activate_buzzer:
  name: Activate buzzer
  description: Plays a tone on an OpenDisplay device's buzzer.
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: opendisplay
    instance:
      name: Buzzer instance
      description: Buzzer instance index (0-based) for devices with more than one buzzer.
      required: false
      default: 0
      selector:
        number:
          min: 0
          max: 3
          mode: box
    frequency_hz:
      name: Frequency
      description: >
        Tone frequency in Hz (0 = silence). Played as the nearest quarter-tone
        note. The buzzer's playable range is roughly ~403 Hz to ~11840 Hz,
        expressed in Hz for convenience; pitches outside that range are shifted
        by whole octaves by the firmware to protect the speaker hardware.
      required: false
      default: 1000
      selector:
        number:
          min: 0
          max: 12000
          mode: box
          unit_of_measurement: Hz
    duration_ms:
      name: Duration
      description: Tone duration in milliseconds (5–1275, in 5 ms steps).
      required: false
      default: 100
      selector:
        number:
          min: 5
          max: 1275
          mode: box
          unit_of_measurement: ms
    repeats:
      name: Repeats
      description: Number of times to repeat the tone (1–255).
      required: false
      default: 1
      selector:
        number:
          min: 1
          max: 255
          mode: box

write_nfc:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: opendisplay
    record_type:
      required: false
      default: "url"
      selector:
        select:
          translation_key: nfc_record_type
          options:
            - "url"
            - "text"
            - "mime"
            - "ha_tag"
    content:
      required: true
      selector:
        text:
          multiline: true
    mime_type:
      required: false
      example: text/vcard
      selector:
        text:

play_melody:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: opendisplay
    instance:
      required: false
      default: 0
      selector:
        number:
          min: 0
          max: 3
          mode: box
    notes:
      required: true
      example: "C5 C5 G5 G5 A5 A5 G5/2"
      selector:
        text:
    tempo:
      required: false
      default: 120
      selector:
        number:
          min: 40
          max: 400
          mode: box
          unit_of_measurement: BPM
    repeats:
      required: false
      default: 1
      selector:
        number:
          min: 1
          max: 255
          mode: box
    default_note_ms:
      required: false
      default: 200
      selector:
        number:
          min: 5
          max: 1275
          mode: box
          unit_of_measurement: ms
    default_length:
      required: false
      selector:
        select:
          options:
            - "1"
            - "2"
            - "4"
            - "8"
            - "16"
            - "32"

drawcustom:
  name: Draw Custom Image
  description: Draws a custom image on one or more OpenDisplay devices
  target:
  fields:
    payload:
      name: Payload
      description: Drawing elements array (see drawcustom documentation)
      required: true
      example: >
        [{"type": "text", "value": "Hello!", "x": 0, "y": 0, "size": 40}]
      selector:
        object:
    background:
      name: Background color
      description: Background color
      required: true
      default: "white"
      example: white
      selector:
        select:
          options:
            - "white"
            - "black"
            - "accent"
            - "red"
            - "yellow"
    rotate:
      name: Rotation
      description: Rotation in degrees (0, 90, 180, 270)
      required: true
      default: 0
      selector:
        number:
          min: 0
          max: 270
          step: 90
    dither:
      name: Dither mode
      description: Dithering algorithm
      required: true
      default: "burkes"
      selector:
        select:
          translation_key: dither_mode
          options:
            - "none"
            - "burkes"
            - "ordered"
            - "floyd_steinberg"
            - "atkinson"
            - "stucki"
            - "sierra"
            - "sierra_lite"
            - "jarvis_judice_ninke"
            - "dizzy"
    refresh_type:
      name: Refresh type
      description: E-paper refresh mode
      required: true
      default: "full"
      selector:
        select:
          translation_key: refresh_mode
          options:
            - "full"
            - "fast"
            - "partial"
    tone_compression:
      name: Tone compression
      description: Tone compression strength (0–100%). Omit to use automatic tone mapping.
      required: false
      selector:
        number:
          min: 0
          max: 100
          step: 1
          mode: slider
          unit_of_measurement: "%"
    measured_palette:
      name: Use measured palette
      description: Use the panel's measured color palette when available. Turn off to dither against the theoretical color scheme. No effect on panels without measured data.
      required: false
      default: false
      selector:
        boolean:
    dry-run:
      name: Dry run
      description: Generate image without sending to device
      required: true
      default: false
      selector:
        boolean:
